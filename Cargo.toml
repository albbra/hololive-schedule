[package]
name = "hololive-schedule"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
slint        = "1.8"
reqwest      = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
webbrowser   = "1.0"
chrono       = "0.4"
chrono-tz    = "0.10"
image        = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"

[build-dependencies]
slint-build = "1.8"